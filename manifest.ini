name = sbaitso
summary = "Dr. Sbaitso (SmoothTalker) synthesizer"
description = """Speech synthesizer that emulates the original 1990 First Byte SmoothTalker engine shipped with Creative Labs' Dr. Sbaitso, running the real 16-bit DOS speech code under the Unicorn CPU emulator.

Rate, pitch, tone and volume are supported. Note that the engine's maximum speaking rate is modest by modern screen reader standards."""
